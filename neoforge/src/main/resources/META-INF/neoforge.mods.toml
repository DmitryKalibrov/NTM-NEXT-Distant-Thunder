[[mods]]
modId = "ntm_distant_thunder"
version = "${version}"
displayName = "NTM-NEXT: Distant Thunder"
authors = "DmitryKalibrov"
description = "The bomb drops 5 km away. A silent flash, then the ground trembles, and seconds later a deep rolling thunder washes over you as dust falls from the trees. Atmospheric, delayed, distance-muffled sound for NTM-NEXT nukes, explosions and gunfire, with camera shake and a sweeping dust shockwave."

[[mixins]]
config = "ntm_distant_thunder.mixins.json"

